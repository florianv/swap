name: Psalm

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  psalm:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Install dependencies
        uses: ramsey/composer-install@v3
        with:
          dependency-versions: highest

      # On pushes to master, also send type coverage to shepherd.dev (README badge).
      # Pull request runs don't, so the coverage history only follows master.
      - name: Run Psalm
        run: vendor/bin/psalm --no-progress --output-format=github ${{ github.event_name == 'push' && '--shepherd' || '' }}
